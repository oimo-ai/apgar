[project]
name = "apgar"
version = "0.1.3"
description = "Release health for AI agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pydantic-settings>=2.4",
  "clickhouse-connect[async]>=0.8", "opentelemetry-proto>=1.27", "protobuf>=5.26", "numpy>=2.0",
  "httpx>=0.27", "click>=8.1", "cryptography>=43.0", "prometheus-client>=0.20",
]

[project.urls]
Homepage = "https://github.com/oimo-ai/apgar"
Repository = "https://github.com/oimo-ai/apgar"
Issues = "https://github.com/oimo-ai/apgar/issues"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11", "pyyaml>=6.0", "types-PyYAML", "types-protobuf"]

[project.scripts]
apgar = "apgar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apgar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["apgar", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs ClickHouse",
  "slow: performance tests",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
