apiVersion: v1
kind: Service
metadata:
  name: {{ include "apgar.fullname" . }}-ui
  labels:
    {{- include "apgar.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  selector:
    {{- include "apgar.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
