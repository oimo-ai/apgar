name: ci
"on":
  push:
    branches: [main]
  pull_request:
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'apgar/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'Dockerfile'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            ui:
              - 'ui/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
  python:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: apgar
          CLICKHOUSE_PASSWORD: apgar_test
          CLICKHOUSE_DB: apgar
        ports:
          - 18123:8123
        options: --health-cmd "wget -q --spider http://localhost:8123/ping" --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: make lint
      - run: make typecheck
      - run: make test-coverage
  docker-apgar:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t apgar:dev .
  docker-ui:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t apgar-ui:dev -f ui/Dockerfile .
  ui:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run tokens
      - run: npm run lint
      - run: npm run lint:colors
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
  result:
    needs: [changes, python, docker-apgar, docker-ui, ui]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a selected job failed
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.python.result }} ${{ needs.docker-apgar.result }} ${{ needs.docker-ui.result }} ${{ needs.ui.result }}
        run: |
          set -eu
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
