{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apgar.secretName" . }}
  labels:
    {{- include "apgar.labels" . | nindent 4 }}
type: Opaque
data:
  APGAR_SECRET_KEY: {{ .Values.secret.secretKey | b64enc | quote }}
  APGAR_ADMIN_TOKEN: {{ .Values.secret.adminToken | b64enc | quote }}
  APGAR_CLICKHOUSE_PASSWORD: {{ .Values.secret.clickhousePassword | b64enc | quote }}
{{- end }}
