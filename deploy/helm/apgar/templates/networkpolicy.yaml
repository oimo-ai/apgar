{{- if .Values.networkPolicy.enabled }}
{{- if .Values.clickhouse.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "apgar.fullname" . }}-clickhouse
  labels:
    {{- include "apgar.componentLabels" (dict "root" . "component" "clickhouse") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "apgar.selectorLabels" (dict "root" . "component" "clickhouse") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "apgar.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [api, worker]
      ports:
        - port: 8123
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "apgar.fullname" . }}-worker
  labels:
    {{- include "apgar.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "apgar.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "apgar.selectorLabels" (dict "root" . "component" "api") | nindent 14 }}
        {{- with .Values.networkPolicy.metricsFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 8001
{{- end }}
