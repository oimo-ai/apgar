services:
  clickhouse-test:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: apgar
      CLICKHOUSE_PASSWORD: apgar_test
      CLICKHOUSE_DB: apgar
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "18123:8123"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
