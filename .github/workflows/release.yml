name: release
"on":
  push:
    tags:
      - "v*"
permissions:
  contents: write
  packages: write
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      minor: ${{ steps.check.outputs.minor }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: python3 scripts/release_version.py check "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
  images:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta-apgar
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/apgar
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},priority=1000
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-apgar.outputs.tags }}
          labels: ${{ steps.meta-apgar.outputs.labels }}
      - id: meta-ui
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/apgar-ui
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},priority=1000
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
          labels: org.opencontainers.image.title=apgar-ui
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
  chart:
    needs: [version, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: helm package deploy/helm/apgar --version "${{ needs.version.outputs.version }}" --app-version "${{ needs.version.outputs.version }}" --destination "$RUNNER_TEMP"
      - run: helm push "$RUNNER_TEMP/apgar-${{ needs.version.outputs.version }}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
  release:
    needs: [version, images, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/release_version.py check "$GITHUB_REF_NAME" --compose "$RUNNER_TEMP/docker-compose.yml"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/docker-compose.yml
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            The Compose file for this release is attached as `docker-compose.yml`. To upgrade, back up the ClickHouse volume, then run these commands in the directory that holds the Compose file:

            ```bash
            curl -fsSLO ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/docker-compose.yml
            docker compose pull
            docker compose up -d --wait
            ```

            On Kubernetes, back up ClickHouse, then upgrade the Helm chart to this version. Use the namespace you installed it in:

            ```bash
            helm upgrade apgar oci://ghcr.io/${{ github.repository_owner }}/charts/apgar --version ${{ needs.version.outputs.version }} -n apgar --reset-then-reuse-values
            ```
