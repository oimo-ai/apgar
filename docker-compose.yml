# Apgar on Docker Compose. Every release attaches this file with its image tags:
# https://github.com/oimo-ai/apgar/releases
# Keep local changes in docker-compose.override.yml, so an upgrade can replace this file.
name: apgar
x-apgar: &apgar
  image: ghcr.io/oimo-ai/apgar:0.1.2
  env_file: .env
  environment: &apgar-env
    APGAR_CLICKHOUSE_URL: http://clickhouse:8123
    APGAR_CLICKHOUSE_USER: apgar
    APGAR_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set it in .env}
    APGAR_CLICKHOUSE_DATABASE: apgar
    APGAR_SECRET_KEY: ${APGAR_SECRET_KEY:?set it in .env}
    APGAR_ADMIN_TOKEN: ${APGAR_ADMIN_TOKEN:?set it in .env}
    # Proxies that append to X-Forwarded-For, counting apgar-ui. Set 2 in .env behind a reverse proxy.
    APGAR_TRUSTED_PROXY_HOPS: ${APGAR_TRUSTED_PROXY_HOPS:-1}
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    environment: { CLICKHOUSE_USER: apgar, CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set it in .env}", CLICKHOUSE_DB: apgar }
    volumes: [clickhouse-data:/var/lib/clickhouse]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
  apgar-migrate:
    <<: *apgar
    command: migrate
    restart: "no"
    depends_on: { clickhouse: { condition: service_healthy } }
  apgar-api:
    <<: *apgar
    command: api
    restart: unless-stopped
    environment:
      <<: *apgar-env
      APGAR_WORKER_METRICS_URL: http://apgar-worker:8001/metrics
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on: { apgar-migrate: { condition: service_completed_successfully } }
  apgar-worker:
    <<: *apgar
    command: worker
    restart: unless-stopped
    deploy: { replicas: 1 }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/metrics', timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on: { apgar-migrate: { condition: service_completed_successfully } }
  apgar-ui:
    image: ghcr.io/oimo-ai/apgar-ui:0.1.2
    restart: unless-stopped
    ports: ["8080:8080"]
    environment: { API_UPSTREAM: http://apgar-api:8000 }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on: [apgar-api]
volumes:
  clickhouse-data: {}
