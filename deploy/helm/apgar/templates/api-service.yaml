apiVersion: v1
kind: Service
metadata:
  name: {{ include "apgar.fullname" . }}-api
  labels:
    {{- include "apgar.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "apgar.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
